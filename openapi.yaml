  # ═══════════════════════════════════════════════════════════
  # 空间模块 (Space)
  # 设计说明：整个服务器即唯一空间，此模块返回单例信息
  # TODO: 考虑将此模块合并到 Server 模块或简化为配置项
  # ═══════════════════════════════════════════════════════════

  /api/v1/cloudfs/list:
    get:
      tags:
      - CloudFS
      summary: 列出文件/文件夹
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: path
        in: query
        schema:
          type: string
          default: /
      responses:
        '200':
          description: 目录内容
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudFileItem'
                  path:
                    type: string
  /api/v1/cloudfs/folder:
    post:
      tags:
      - CloudFS
      summary: 创建文件夹
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              - name
              properties:
                path:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: 创建成功
        '409':
          description: 文件夹已存在
  /api/v1/cloudfs/upload:
    post:
      tags:
      - CloudFS
      summary: 上传文件
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                path:
                  type: string
                  default: /
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功
        '413':
          description: 文件过大
  /api/v1/cloudfs/download:
    get:
      tags:
      - CloudFS
      summary: 下载文件
      description: |
        以 attachment 返回文件流。若该文件上传时已记录完整性校验值，响应会带
        X-File-Checksum: sha256=<lowercase-hex>，客户端可据此校验下载内容；
        历史文件无该校验值时不返回该响应头。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 文件流
          headers:
            X-File-Checksum:
              schema:
                type: string
              description: 'sha256=<hex>；仅当存在已记录的校验值时返回'
        '404':
          description: 文件不存在
  /api/v1/cloudfs/delete:
    delete:
      tags:
      - CloudFS
      summary: 删除文件或文件夹
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 删除成功
        '404':
          description: 项目不存在
  /api/v1/cloudfs/preview:
    get:
      tags:
      - CloudFS
      summary: 在线预览文件
      description: |
        与 download 同鉴权、同权限校验（Space 成员 + 文件可见性），但按 MIME 白名单
        以内联方式返回（Content-Disposition: inline），便于图片/文本/PDF/音视频
        直接渲染。白名单之外（含 image/svg+xml、text/html）一律回落为 attachment，
        且 Content-Type 降级为 application/octet-stream + X-Content-Type-Options: nosniff。
        支持 HTTP Range（206），可分段加载大文件。download 端点行为不变。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 文件流（白名单类型为 inline，其余为 attachment）
          headers:
            Content-Disposition:
              schema:
                type: string
              description: inline（白名单类型）或 attachment（回落）
            X-Content-Type-Options:
              schema:
                type: string
              description: 固定为 nosniff
            X-File-Checksum:
              schema:
                type: string
              description: 'sha256=<hex>；仅当存在已记录的校验值时返回'
        '206':
          description: 分段内容（Range 请求）
        '400':
          description: 缺少 path 参数
        '403':
          description: 非 Space 成员或无权限
        '404':
          description: 文件不存在
  /api/v1/cloudfs/rename:
    patch:
      tags:
      - CloudFS
      summary: 重命名文件或文件夹
      description: |
        在同一父目录内改名；文件本体（物理存储）不动，仅更新逻辑名与路径。
        文件夹改名会递归更新整棵子树的 path / file_path（单事务）。
        权限与删除一致：上传者/所有者本人或 Space 管理员。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              - newName
              properties:
                path:
                  type: string
                  description: 现有文件或文件夹的完整路径
                newName:
                  type: string
                  description: 新名称（单层路径段，不含 /）
      responses:
        '200':
          description: 重命名成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      type:
                        type: string
                        enum: [file, folder]
                      path:
                        type: string
                      name:
                        type: string
        '400':
          description: 名称为空/非法（CLOUDFS_NAME_INVALID）或过长（CLOUDFS_NAME_TOO_LONG）
        '403':
          description: 无权限（CLOUDFS_PERMISSION_DENIED）
        '404':
          description: 文件或文件夹不存在
        '409':
          description: 目标名称已存在（CLOUDFS_ALREADY_EXISTS）
  /api/v1/cloudfs/move:
    post:
      tags:
      - CloudFS
      summary: 移动文件或文件夹
      description: |
        移入目标父目录并保留原名。文件更新 folder_id 与 file_path；文件夹更新
        parent_id 并递归改写子树 path / file_path（单事务，任一目标路径冲突则整体回滚）。
        不允许移动到自身或其子目录。权限与删除一致，另需目标目录写权限。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              - targetPath
              properties:
                path:
                  type: string
                  description: 现有文件或文件夹的完整路径
                targetPath:
                  type: string
                  description: 目标父目录路径，根目录为 /
      responses:
        '200':
          description: 移动成功
        '400':
          description: 目标目录不存在、或移动到自身/子目录
        '403':
          description: 无权限（CLOUDFS_PERMISSION_DENIED）
        '404':
          description: 文件或文件夹不存在
        '409':
          description: 目标位置同名项已存在（CLOUDFS_ALREADY_EXISTS）
  /api/v1/cloudfs/search:
    get:
      tags:
      - CloudFS
      summary: 按文件名搜索
      description: |
        按文件名模糊搜索（大小写不敏感，`%`/`_` 按字面量匹配，不做通配）。
        默认范围为整个 Space；传入 path 时限定在该目录及其子树内（递归）。
        仅返回文件（不含文件夹），最多 100 条，按创建时间倒序。
        权限与 list 一致：Space 成员即可，不额外做条目级鉴权。
        已进入回收站（软删）的条目不参与搜索。结果含 path 字段，便于跨目录定位。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: q
        in: query
        required: true
        description: 文件名关键词（不能为空）
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: 限定搜索的目录路径（含其子树）；缺省为整个 Space
        schema:
          type: string
      responses:
        '200':
          description: 搜索结果（最多 100 条）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      query:
                        type: string
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            type:
                              type: string
                              enum: [file]
                            path:
                              type: string
                              description: 命中文件的完整逻辑路径
                            size:
                              type: string
                            uploadBy:
                              type: string
                            updatedAt:
                              type: string
        '400':
          description: 缺少或为空的 q
        '403':
          description: 非 Space 成员
  /api/v1/cloudfs/trash:
    get:
      tags:
      - CloudFS
      summary: 列出回收站（已删除项）
      description: |
        列出当前 Space 内被删除（软删）的顶层条目，最新的在前。删除文件夹时整棵子树
        随文件夹一起进入回收站，其子项不再单独列出（与系统回收站一致）。
        回收站内容不计入 /cloudfs/usage 的用量统计，但在保留期内仍占用磁盘。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 回收站列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      retainDays:
                        type: integer
                        description: 保留天数（过期后由后台任务彻底删除）
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            type:
                              type: string
                              enum: [file, folder]
                            path:
                              type: string
                            size:
                              type: string
                            uploadBy:
                              type: string
                            deletedAt:
                              type: string
                            expiresAt:
                              type: string
        '403':
          description: 非 Space 成员
    delete:
      tags:
      - CloudFS
      summary: 彻底删除回收站中的单项
      description: 删除 DB 行、FileMetadata 行与磁盘内容，不可恢复。文件夹会连同其已删除子树一并清除。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: id
        in: query
        required: false
        description: 条目 ID（与 path 二选一）
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: 条目路径（与 id 二选一）
        schema:
          type: string
      responses:
        '200':
          description: 已彻底删除
        '400':
          description: id 与 path 均缺失；或目标不是顶层回收站条目（需先处理其父目录）
        '403':
          description: 无权限（CLOUDFS_PERMISSION_DENIED）
        '404':
          description: 回收站中不存在该条目
  /api/v1/cloudfs/trash/all:
    delete:
      tags:
      - CloudFS
      summary: 清空回收站
      description: 彻底删除当前 Space 回收站中的所有条目（含磁盘内容与元数据）。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 已清空，返回清除条目数
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      purged:
                        type: integer
        '403':
          description: 非 Space 成员
  /api/v1/cloudfs/trash/restore:
    post:
      tags:
      - CloudFS
      summary: 还原回收站条目
      description: |
        清除 deleted_at 并把内容从 .trash 移回原位；文件夹会连同其已删除子树整体还原。
        原位置若已被占用则返回冲突（CLOUDFS_ALREADY_EXISTS），不发生任何修改。
        权限与删除一致：条目所有者本人或 Space 管理员。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: 条目 ID（与 path 二选一）
                path:
                  type: string
                  description: 条目路径（与 id 二选一）
      responses:
        '200':
          description: 已还原
        '400':
          description: id 与 path 均缺失；或目标不是顶层回收站条目（需先还原其父目录）
        '403':
          description: 无权限（CLOUDFS_PERMISSION_DENIED）
        '404':
          description: 回收站中不存在该条目
        '409':
          description: 原位置已被占用（CLOUDFS_ALREADY_EXISTS）
  /api/v1/cloudfs/usage:
    get:
      tags:
      - CloudFS
      summary: 获取存储用量与配额
      description: 返回当前 Space 的已用字节数、配额与使用百分比（已实现，此前遗漏登记）。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 用量信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      used:
                        type: integer
                        format: int64
                      quota:
                        type: integer
                        format: int64
                      usedPercent:
                        type: number
        '403':
          description: 非 Space 成员
  # ═══════════════════════════════════════════════════════════
  # 云文件分享链接（DES-2026-0912-05）
  # 仅支持单文件分享；GET /api/v1/share/{token} 三条是**免鉴权**接口，
  # 其余三条挂在既有 cloudfs 鉴权组下。
  # ═══════════════════════════════════════════════════════════
  /api/v1/cloudfs/share:
    post:
      tags:
      - CloudFS
      summary: 创建云文件分享链接（单文件）
      description: |
        为 Space 内可见的单个文件创建带 token 的分享链接。库中只保存
        sha256(token)，因此响应中的 token 是唯一一次可见的明文，客户端必须立即保存。
        expiresInDays 必填逻辑：省略或 0 表示默认 7 天，上限 30 天。
        maxDownloads = 0 表示不限次数。password 可选（bcrypt 存储）。
        不接受任何路径/文件名参数，只认 fileId。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fileId
              properties:
                fileId:
                  type: string
                  description: cloudfs 文件 ID（SharedFileEntry.ID）
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 7
                password:
                  type: string
                  maxLength: 128
                maxDownloads:
                  type: integer
                  minimum: 0
                  default: 0
      responses:
        '200':
          description: 创建成功（token 只在此返回一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: share_723169646487932928
                      fileId:
                        type: string
                      token:
                        type: string
                        description: 明文分享令牌（仅此一次）
                      tokenPrefix:
                        type: string
                        description: 前 8 位，仅供列表展示，不能用于校验
                      sharePath:
                        type: string
                        example: /api/v1/share/xxxxxxxx
                      url:
                        type: string
                        description: PublicAddress 非空时才返回
                      expiresAt:
                        type: string
                        format: date-time
                      maxDownloads:
                        type: integer
                      requiresPassword:
                        type: boolean
        '400':
          description: 参数不合法（有效期越界 / 次数为负 / 密码过长）
        '403':
          description: 非 Space 成员或文件不可见
        '404':
          description: 文件不存在
  /api/v1/cloudfs/shares:
    get:
      tags:
      - CloudFS
      summary: 列出 Space 内的分享链接
      description: 返回非敏感字段；tokenHash / passwordHash 与明文 token 永不返回。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: fileId
        in: query
        required: false
        schema:
          type: string
        description: 只看某个文件的分享
      responses:
        '200':
          description: 分享列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            fileId:
                              type: string
                            fileName:
                              type: string
                            fileDeleted:
                              type: boolean
                            tokenPrefix:
                              type: string
                            requiresPassword:
                              type: boolean
                            expiresAt:
                              type: string
                              format: date-time
                            maxDownloads:
                              type: integer
                            downloadCount:
                              type: integer
                            revoked:
                              type: boolean
                            expired:
                              type: boolean
                            createdAt:
                              type: string
                              format: date-time
                            revokedAt:
                              type: string
                              format: date-time
                            lastAccessAt:
                              type: string
                              format: date-time
  /api/v1/cloudfs/share/{shareId}:
    delete:
      tags:
      - CloudFS
      summary: 撤销分享链接
      description: 创建者本人或 Space 管理员可撤销；撤销后 token 永久失效，不可恢复。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: shareId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 已撤销
        '403':
          description: 无权撤销该分享
        '404':
          description: 分享不存在
  /api/v1/share/{token}:
    get:
      tags:
      - CloudFS
      summary: 获取分享元信息（免鉴权）
      description: |
        公开接口：凭 token 返回文件名/大小/是否需密码/是否已失效。**不返回**
        storage key、磁盘路径、ownerID，也不暴露其它分享的存在性；链接失效后
        不再返回文件名等文件元信息。响应统一带 nosniff / no-store /
        noindex,nofollow / no-referrer。
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 元信息（含 available / expired / revoked / exhausted 状态位）
        '404':
          description: 分享不存在
        '429':
          description: 触发按 IP 或按分享的限流
  /api/v1/share/{token}/verify:
    post:
      tags:
      - CloudFS
      summary: 校验分享密码，换取一次性下载凭据（免鉴权）
      description: |
        **「密码错误」与「分享不存在」返回完全相同的错误响应**（同一错误码/文案/
        状态码），避免该接口被用来探测分享是否存在。校验通过后签发 5 分钟有效、
        只能使用一次的 ticket，供 download 使用；无密码分享也会签发 ticket。
        失败累计触发 BruteForceProtector 锁定（按分享 5 次 / 按 IP 20 次）。
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: 校验通过
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket:
                        type: string
                        description: 一次性下载凭据（5 分钟内有效）
                      expiresIn:
                        type: integer
                        example: 300
        '401':
          description: 校验失败（链接无效或密码错误，二者不可区分）
        '429':
          description: 失败次数过多，已被锁定
  /api/v1/share/{token}/download:
    get:
      tags:
      - CloudFS
      summary: 下载分享文件（免鉴权）
      description: |
        先原子占用下载配额（并发下不会突破 maxDownloads），再返回文件内容。
        有密码的分享必须先调用 verify 并把 ticket 传进来。MIME 白名单内 inline，
        其余（含 SVG/HTML）一律 attachment + nosniff；响应不带缓存、不可被索引。
        只按分享记录的 FileID 取文件，不接受任何路径参数。
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: ticket
        in: query
        required: false
        schema:
          type: string
        description: 有密码的分享必填（由 verify 返回）
      responses:
        '200':
          description: 文件内容
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 白名单内 inline，其余 attachment
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Robots-Tag:
              schema:
                type: string
                example: noindex, nofollow
            Referrer-Policy:
              schema:
                type: string
                example: no-referrer
        '401':
          description: 需要先通过密码校验（缺少或无效的 ticket）
        '403':
          description: 已达下载次数上限
        '404':
          description: 分享不存在
        '410':
          description: 分享已过期或已被撤销
  /api/v1/server/version:
    get:
      tags: [Server]
      summary: 获取服务端版本信息
      description: 返回当前服务端版本、构建信息、最低兼容客户端版本及功能开关。客户端首次连接时应调用此接口检查兼容性。
      security: []
      responses:
        '200':
          description: 版本信息
          content:
            application/json:
              schema:
                type: object
                required: [version, build_time, min_client_version]
                properties:
                  version:
                    type: string
                    example: 1.2.3
                  build_time:
                    type: string
                    example: '20240115'
                  git_commit:
                    type: string
                    example: abc1234
                  go_version:
                    type: string
                    example: go1.21
                  min_client_version:
                    type: string
                    example: 1.0.0
                  features:
                    type: object
                    properties:
                      voice: {type: boolean, example: true}
                      screen_share: {type: boolean, example: true}
                      whiteboard: {type: boolean, example: true}
                      bots: {type: boolean, example: true}
                      vpn: {type: boolean, example: false}
  /api/v1/server/compatibility:
    get:
      tags: [Server]
      summary: 获取兼容性信息
      description: 返回服务端与客户端的兼容性矩阵。
      security: []
      responses:
        '200':
          description: 兼容性信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_version: {type: string, example: 1.2.3}
                  min_client_version: {type: string, example: 1.0.0}
                  max_client_version: {type: string, example: 1.9.9}
                  supported_features:
                    type: array
                    items: {type: string}
                    example: [voice, screen_share, whiteboard, bots]
  /api/v1/admin/update/check:
    get:
      tags: [Update]
      summary: 检查服务端更新
      description: 管理员检查是否有新版本可用。返回最新版本信息和更新级别（critical/recommended/optional/none）。
      security:
      - BearerAuth: []
      responses:
        '200':
          description: 更新检查结果
          content:
            application/json:
              schema:
                type: object
                required: [update_available, current_version, latest_version]
                properties:
                  update_available: {type: boolean, example: true}
                  current_version: {type: string, example: 1.2.3}
                  latest_version: {type: string, example: 1.3.0}
                  severity:
                    type: string
                    enum: [critical, recommended, optional, none]
                    description: critical=安全修复必须更新, recommended=建议更新, optional=可选, none=已是最新
                    example: recommended
                  release_url: {type: string, format: uri}
                  changelog: {type: string}
                  published_at: {type: string, format: date-time}
                  breaking_changes: {type: boolean, example: false}
        '403':
          description: 需要管理员权限

  # ── E4：admin 全局分享管理（DES-20261001-01 §11.2）──
  # 实际路由同时挂在 /api/admin/... 与 /api/v1/admin/... 两个前缀下，此处登记 v1 形式。
  /api/v1/admin/cloudfs/shares:
    get:
      tags: [CloudFS, Admin]
      summary: 跨空间列出全部分享链接（admin）
      description: |-
        全局管理员（RoleAdmin+）跨**全部空间**列出分享。联出文件名（cloud_files.fileName，
        文件软删/缺失时为空串）与空间名（spaces.name）。按 created_at DESC 排序；
        不过滤已撤销/已过期（由 revoked/expired 字段呈现状态）。
        tokenHash / passwordHash 与明文 token 永不返回。
      security:
      - BearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        description: 每页数量，默认 50，超过 200 截断为 200
      - name: offset
        in: query
        required: false
        schema: {type: integer, minimum: 0, default: 0}
        description: 跳过条数
      responses:
        '200':
          description: 全局分享列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                            fileId: {type: string}
                            fileName: {type: string, description: 文件软删/缺失时为空串}
                            userId: {type: string, description: 分享属主用户ID}
                            spaceId: {type: string}
                            spaceName: {type: string, description: 空间软删/缺失时为空串}
                            downloadCount: {type: integer}
                            lastAccessAt: {type: string, format: date-time, nullable: true}
                            revoked: {type: boolean}
                            expired: {type: boolean}
                            requiresPassword: {type: boolean}
                            expiresAt: {type: string, format: date-time}
                            createdAt: {type: string, format: date-time}
        '403':
          description: 需要 RoleAdmin+ 权限
  /api/v1/admin/cloudfs/shares/{id}:
    delete:
      tags: [CloudFS, Admin]
      summary: 撤销任意空间的分享链接（admin）
      description: |-
        全局管理员（RoleAdmin+）按分享 ID 撤销，绕过空间成员/属主限制。
        复用空间内撤销语义：写 revoked_at 后永不复活；幂等（重复撤销返回 200）；
        分享不存在返回 404。撤销成功写 SecurityAuditLog（action=admin.cloudfs.share_revoked），
        幂等重复撤销不重复写审计。
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: 分享ID
      responses:
        '200':
          description: 已撤销（含幂等重复撤销）
        '403':
          description: 需要 RoleAdmin+ 权限
        '404':
          description: 分享不存在

  /api/v1/client/update:
    get:
      tags: [Update]
      summary: 获取客户端更新信息
      description: 客户端检查是否有新版本可用。返回下载地址和更新级别。
      parameters:
      - name: platform
        in: query
        required: true
        schema:
          type: string
          enum: [windows, macos, linux, web]
      - name: arch
        in: query
        required: false
        schema:
          type: string
          enum: [x64, arm64]
      - name: current_version
        in: query
        required: true
        schema: {type: string}
        example: 1.2.3
      security: []
      responses:
        '200':
          description: 客户端更新信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: {type: string, example: 1.2.3}
                  latest: {type: string, example: 1.3.0}
                  required:
                    type: boolean
                    description: 是否为强制更新（API不兼容时必须更新）
                    example: false
                  url: {type: string, format: uri}
                  changelog: {type: string}
                  published_at: {type: string, format: date-time}
                  size: {type: integer, description: 文件大小（字节）, example: 52428800}
                  checksum: {type: string, description: SHA-256 校验值}
  /api/v1/notifications:
    get:
      tags: [Users]
      summary: 获取用户通知列表
      description: 获取用户的 @提及、系统通知、回复等通知列表。支持分页。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: limit
        in: query
        schema: {type: integer, default: 20}
      - name: before
        in: query
        schema: {type: string}
        description: 游标分页，上一页最后一条的ID
      - name: unread_only
        in: query
        schema: {type: boolean, default: false}
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        type:
                          type: string
                          enum: [mention, reply, system, bot, recording]
                          description: mention=@提及 reply=回复 system=系统通知 bot=机器人 recording=录制
                        title: {type: string, description: 通知标题}
                        body: {type: string, description: 通知内容}
                        read: {type: boolean}
                        data:
                          type: object
                          description: 关联数据(消息ID/频道ID/跳转链接)
                        created_at: {type: string, format: date-time}
  /api/v1/notifications/read-all:
    post:
      tags: [Users]
      summary: 标记所有通知为已读
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 操作成功

  /api/v1/notifications/{id}/read:
    post:
      tags: [Users]
      summary: 标记单条通知为已读
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: 操作成功

  # ═══════════════════════════════════════════════════════════
  # @提及 (Mentions)
  # ═══════════════════════════════════════════════════════════

  /api/v1/mentions/search:
    get:
      tags: [Users]
      summary: 搜索可@提及的用户
      description: 在消息输入框中输入 @ 时，搜索频道内可提及的用户。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: channel_id
        in: query
        required: true
        schema: {type: string}
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 1}
        description: 搜索关键词 (用户名/显示名)
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id: {type: string}
                    username: {type: string}
                    display_name: {type: string}
                    avatar_url: {type: string}
                    role: {type: string}
  /api/v1/messages/search:
    get:
      tags: [Messages]
      summary: 全文搜索消息
      description: 在所有可见频道中搜索消息内容，支持关键词、来源频道、发送者过滤。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 2}
        description: 搜索关键词
      - name: channel_id
        in: query
        schema: {type: string}
        description: 限定频道 (可选)
      - name: from
        in: query
        schema: {type: string}
        description: 限定发送者 (可选)
      - name: before
        in: query
        schema: {type: string, format: date-time}
        description: 早于此时间 (可选)
      - name: after
        in: query
        schema: {type: string, format: date-time}
        description: 晚于此时间 (可选)
      - name: limit
        in: query
        schema: {type: integer, default: 25}
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id: {type: string}
                        channel_id: {type: string}
                        channel_name: {type: string}
                        author: {type: string}
                        content: {type: string}
                        created_at: {type: string, format: date-time}
                        author_id: {type: string}
                  total: {type: integer}
  /api/v1/minigames/list:
    get:
      tags: [Minigames]
      summary: 获取可用游戏列表
      description: |
        返回游戏注册表（设计 §15.3.3 / §15.7.4）。
        `category=single` 为单机游戏（无需房间、各有排行榜，不注册服务端引擎），
        `category=multi` 为多人联机游戏（需房间、无排行榜）。
        `scoreDimension`/`scoreOrder` 描述该游戏排行榜的维度与排序方向（asc = 越小越好）。
      security: [BearerAuth: [], CookieAuth: []]
      responses:
        '200':
          description: 游戏列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, example: tictactoe}
                        name: {type: string, example: 井字棋}
                        players: {type: integer, description: 人数上限}
                        minPlayers: {type: integer, description: 开局人数下限（0 表示等于 players）}
                        online: {type: boolean, description: 是否支持多人联机}
                        localOnly: {type: boolean, description: 是否仅本地单机}
                        category: {type: string, enum: [single, multi]}
                        scoreDimension: {type: string, description: 排行榜维度，空表示无排行榜}
                        scoreOrder: {type: string, enum: [desc, asc]}

  /api/v1/minigames/join:
    post:
      tags: [Minigames]
      summary: 创建或加入频道内的游戏会话
      security: [BearerAuth: [], CookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [gameType], properties: {gameType: {type: string}}}
      responses:
        '200': {description: 加入成功}
        '400': {description: 请求参数错误}
        '403': {description: 无权限（非频道成员）}

  /api/v1/minigames/leave:
    post:
      tags: [Minigames]
      summary: 离开游戏会话
      security: [BearerAuth: [], CookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [sessionId], properties: {sessionId: {type: string}}}
      responses:
        '200': {description: 离开成功}
        '404': {description: 会话不存在}

  /api/v1/minigames/action:
    post:
      tags: [Minigames]
      summary: 记录游戏动作并更新会话状态
      description: |
        仅玩家可提交（观战者被拒绝）。action 取值：
        `game_start`（房主，从 waiting 开局）、`game_restart`（房主，「再来一局」，重置 state，设计 §15.3.4）、
        `move_made`/`roll_dice`/`move_pawn`/`bid`/`play`/`werewolf_kill`/`seer_check`/`vote`/`next_phase`（各引擎自行声明）。
      security: [BearerAuth: [], CookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [sessionId, action], properties: {sessionId: {type: string}, action: {type: string}, payload: {type: object}}}
      responses:
        '200': {description: 动作已记录}
        '400': {description: 请求参数错误 / 非法动作 / 非房主 / 人数不足}
        '403': {description: 非该 Space 成员}

  /api/v1/minigames/leaderboard:
    post:
      tags: [Minigames]
      summary: 提交单机游戏成绩
      description: |
        仅单机游戏有排行榜（设计 §15.7.4）。按该游戏的 `scoreOrder` 保留最优成绩：
        desc 取更大值，asc 取更小值（如「最短用时(秒)」）。多人联机游戏会被拒绝。
      security: [BearerAuth: [], CookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [gameType, score], properties: {gameType: {type: string}, score: {type: integer, minimum: 1}}}
      responses:
        '200': {description: 提交结果（bestScore/updated）}
        '400': {description: 分数非法或该游戏无排行榜}
    get:
      tags: [Minigames]
      summary: 查询游戏排行榜
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - {name: gameType, in: query, required: true, schema: {type: string}}
      - {name: limit, in: query, required: false, schema: {type: integer, default: 20}}
      responses:
        '200': {description: 排行榜（含 dimension/order，按该游戏方向排序）}
        '400': {description: 缺少 gameType}

  /api/v1/minigames/scores/me:
    get:
      tags: [Minigames]
      summary: 查询本人某单机游戏的最佳成绩
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - {name: gameType, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: 本人最佳成绩（无记录时 bestScore=0）}
        '400': {description: 缺少 gameType}

  /api/v1/minigames/sessions/{id}/state:
    get:
      tags: [Minigames]
      summary: 获取游戏会话当前状态（断线重连）
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200': {description: 会话状态}
        '404': {description: 会话不存在}

  /api/v1/minigames/chat:
    post:
      tags: [Minigames]
      summary: 发送游戏内聊天消息（同步到文字频道）
      security: [BearerAuth: [], CookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [sessionId, content], properties: {sessionId: {type: string}, content: {type: string}}}
      responses:
        '200': {description: 消息已发送}
        '400': {description: 请求参数错误}

  /api/v1/minigames/invite:
    post:
      tags: [Minigames]
      summary: 发送游戏邀请（系统消息推送到文字频道）
      security: [BearerAuth: [], CookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [gameType, targetUserIds], properties: {gameType: {type: string}, targetUserIds: {type: array, items: {type: string}}}}
      responses:
        '200': {description: 邀请已发送}
        '400': {description: 请求参数错误}

  # ── 日程模块 (schedule) ──
  /api/v1/schedule/events:
    get:
      tags: [Schedule]
      summary: 获取日程事件列表
      description: 支持日期范围查询；非 admin 用户仅可见 scope=all 的日程
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: startDate
        in: query
        schema: {type: string, format: date}
      - name: endDate
        in: query
        schema: {type: string, format: date}
      responses:
        '200': {description: 事件列表, content: {application/json: {schema: {type: object, properties: {code: {type: string}, data: {type: array, items: {type: object}}}}}}}
    post:
      tags: [Schedule]
      summary: 创建新的日程事件
      security: [BearerAuth: [], CookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [title, eventDate, startTime, endTime], properties: {title: {type: string}, description: {type: string}, location: {type: string}, eventDate: {type: string, format: date}, startTime: {type: string, format: date-time}, endTime: {type: string, format: date-time}, allDay: {type: boolean}, scope: {type: string, enum: [all, admin_only]}, reminderMinutes: {type: integer}, channelId: {type: string}, inviteeIds: {type: array, maxItems: 50, items: {type: string}, description: 'A8-S1: 受邀人 userId 列表（可选）。去重后 ≤50、必须全部为空间成员、不含创建者；空/缺省 = 普通事件（行为与历史完全一致）。校验失败返回 400 SCHEDULE_INVITE_INVALID'}}}
      responses:
        '201': {description: 创建成功}
        '400': {description: 请求参数错误；邀请校验失败为错误码 SCHEDULE_INVITE_INVALID}

  /api/v1/schedule/events/{id}:
    put:
      tags: [Schedule]
      summary: 更新指定日程事件
      description: 仅创建者或 admin 可调用
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {title: {type: string}, description: {type: string}, location: {type: string}, eventDate: {type: string, format: date}, startTime: {type: string, format: date-time}, endTime: {type: string, format: date-time}, allDay: {type: boolean}, scope: {type: string}, reminderMinutes: {type: integer}}}
      responses:
        '200':
          description: 更新成功；若该事件带邀请，响应体额外携带 invites 数组（元素结构同 GET /events/{id}/invites 条目；无邀请事件响应形状不变）
          content:
            application/json:
              schema: {type: object, properties: {message: {type: string}, invites: {type: array, items: {$ref: '#/components/schemas/ScheduleInviteInfo'}}}}
        '403': {description: 无权限}
        '404': {description: 事件不存在}
    delete:
      tags: [Schedule]
      summary: 删除指定日程事件
      description: 仅创建者或 admin 可调用
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: 删除成功}
        '403': {description: 无权限}
        '404': {description: 事件不存在}

  /api/v1/schedule/events/{id}/invites:
    get:
      tags: [Schedule]
      summary: 获取日程事件的邀请列表（A8-S1）
      description: >-
        可见者 = 创建者 + 受邀人（scope=admin_only 事件维持 N4 口径，全局 OWNER/ADMIN 亦可见）；
        其余用户一律 404 SCHEDULE_NOT_FOUND（与「事件不存在」同码，不泄露存在性）。
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: 邀请列表
          content:
            application/json:
              schema: {type: object, properties: {code: {type: string}, data: {type: object, properties: {invites: {type: array, items: {$ref: '#/components/schemas/ScheduleInviteInfo'}}}}}}
        '404': {description: 事件不存在或无权查看（SCHEDULE_NOT_FOUND，不区分）}

  /api/v1/schedule/events/{id}/invite:
    put:
      tags: [Schedule]
      summary: 受邀人应答日程邀请（A8-S2）
      description: >-
        仅受邀人本人可调用。status 仅接受 accepted/declined（其余 400 SCHEDULE_INVITE_INVALID）；
        非受邀人返回 404 SCHEDULE_NOT_FOUND（不泄露事件存在性）；幂等：重复同 status 返回 200，
        responded_at 随每次应答刷新。应答后服务端向事件创建者推送 WS schedule_invite_responded；
        事件带邀请被创建/编辑时服务端向全部受邀人推送 WS schedule_invite_updated
        （payload: eventId/title/startsAt/invites[{userId,status}]）。
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [status], properties: {status: {type: string, enum: [accepted, declined]}}}
      responses:
        '200':
          description: 应答成功（含重复应答的幂等成功）
          content:
            application/json:
              schema: {type: object, properties: {code: {type: string}, data: {type: object, properties: {eventId: {type: string}, userId: {type: string}, status: {type: string, enum: [accepted, declined]}, respondedAt: {type: string, format: date-time}}}}}
        '400': {description: 应答状态非法（SCHEDULE_INVITE_INVALID）}
        '404': {description: 事件不存在或非受邀人（SCHEDULE_NOT_FOUND，不区分）}

  # ── 共享文档模块 (sharedoc) ──
  /api/v1/sharedoc/list:
    get:
      tags: [SharedDoc]
      summary: 获取所有共享文档列表
      security: [BearerAuth: [], CookieAuth: []]
      responses:
        '200': {description: 文档列表, content: {application/json: {schema: {type: object, properties: {code: {type: string}, data: {type: array, items: {type: object}}}}}}}

  /api/v1/sharedoc/create:
    post:
      tags: [SharedDoc]
      summary: 创建新的共享文档
      security: [BearerAuth: [], CookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [title], properties: {title: {type: string}, content: {type: string}, channelId: {type: string}}}
      responses:
        '201': {description: 创建成功}
        '400': {description: 请求参数错误}

  /api/v1/sharedoc/{id}:
    get:
      tags: [SharedDoc]
      summary: 获取单个共享文档详情（含正文与版本号）
      description: FIX-20261003-01 NJ-13 新增。列表接口不返回 content/version，
        客户端打开文档、冲突重载、WS 重连对齐必须走本端点。权限与列表一致：文档须属于请求者当前空间
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200': {description: 文档详情, content: {application/json: {schema: {type: object, properties: {code: {type: string}, data: {type: object, properties: {id: {type: string}, title: {type: string}, content: {type: string}, creator: {type: string}, ownerId: {type: string}, version: {type: integer}, updatedAt: {type: string}}}}}}}}
        '404': {description: 文档不存在或不属于当前空间}
    patch:
      tags: [SharedDoc]
      summary: 更新共享文档（乐观并发控制）
      description: 支持 expectedVersion 乐观并发控制；事务内记录版本历史并递增版本号
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [expectedVersion], properties: {title: {type: string}, content: {type: string}, expectedVersion: {type: integer}}}
      responses:
        '200': {description: 更新成功}
        '409': {description: 版本冲突}
        '404': {description: 文档不存在}
    delete:
      tags: [SharedDoc]
      summary: 删除共享文档
      description: 仅 owner 或 admin 可调用
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '204': {description: 删除成功}
        '403': {description: 无权限}
        '404': {description: 文档不存在}

  /api/v1/sharedoc/{id}/versions:
    get:
      tags: [SharedDoc]
      summary: 获取文档版本历史列表
      security: [BearerAuth: [], CookieAuth: []]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200': {description: 版本列表}
        '404': {description: 文档不存在}

  /api/v1/sharedoc/{id}/versions/{versionNo}:
    get:
      tags: [SharedDoc]
      summary: 获取指定版本号的完整内容
      security: [BearerAuth: [], CookieAuth: []]
