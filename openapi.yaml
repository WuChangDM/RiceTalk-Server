  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: 获取审计日志
      description: 分页查询系统审计日志，支持按日志级别、模块、时间范围筛选。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: level
        in: query
        required: false
        schema:
          type: string
          enum:
          - info
          - warn
          - error
        description: 日志级别筛选
        example: error
      - name: module
        in: query
        required: false
        schema:
          type: string
        description: 模块名称筛选
        example: auth
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 起始时间
        example: '2024-01-15T00:00:00Z'
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: 结束时间
        example: '2024-01-15T23:59:59Z'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        description: 返回条数限制
        example: 100
      responses:
        '200':
          description: 审计日志列表
          content:
            application/json:
              schema:
                type: object
                required:
                - logs
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminLog'
                  total:
                    type: integer
                    description: 日志总数
                    example: 5000
                  hasMore:
                    type: boolean
                    description: 是否有更多日志
                    example: true
                  nextCursor:
                    type: string
                    nullable: true
                    description: 下一页游标
                    example: eyJjcmVhdGVkX2F0IjoiMjAyNC0wMS0xNVQxMDowMDowMFoifQ
              examples:
                default:
                  value:
                    logs:
                    - id: log_001
                      level: info
                      module: auth
                      message: 用户登录成功
                      user_id: usr_abc123
                      ip: 192.168.1.100
                      created_at: '2024-01-15T10:00:00Z'
                    - id: log_002
                      level: error
                      module: voice
                      message: 语音服务器连接超时
                      user_id:
                      ip:
                      created_at: '2024-01-15T09:55:00Z'
                    total: 5000
                    has_more: true
                    next_cursor: eyJjcmVhdGVkX2F0IjoiMjAyNC0wMS0xNVQxMDowMDowMFoifQ
        '403':
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 仅管理员可访问
  /api/v1/health:
    get:
      tags: [Server]
      summary: 健康检查
      description: 获取服务器健康状态。无需认证，用于负载均衡和监控探针。
      security: []
      responses:
        '200':
          description: 服务器健康
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - version
                - timestamp
                properties:
                  status:
                    type: string
                    description: 健康状态（当前实现固定返回 ok）
                    example: ok
                  version:
                    type: string
                    description: 服务器版本。构建期经 -ldflags 注入为 <语义版本>+<短commit>；未注入的构建返回 0.2.2
                    example: 0.2.2+1e5a8c0
                  commit:
                    type: string
                    description: 构建所用源码的短提交号；未注入时为空串
                    example: 1e5a8c0
                  buildTime:
                    type: string
                    description: 构建时间（RFC3339/UTC）；未注入时为空串
                    example: '2026-09-12T08:00:00Z'
                  timestamp:
                    type: string
                    description: 响应时间（RFC3339/UTC）
                    example: '2026-09-12T08:00:00Z'
              examples:
                ok:
                  value:
                    status: ok
                    version: 0.2.2+1e5a8c0
                    commit: 1e5a8c0
                    buildTime: '2026-09-12T08:00:00Z'
                    timestamp: '2026-09-12T08:00:00Z'
        '503':
          description: 服务不可用
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - uptime
                - version
              examples:
                unhealthy:
                  value:
                    status: unhealthy
                    uptime: 3600
                    version: 1.2.0
