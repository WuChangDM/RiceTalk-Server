  /api/v1/emojis/{id}/file:
    get:
      tags: [Emojis]
      summary: 获取表情图片文件
      description: |-
        返回表情图片原始字节（PNG/GIF/WebP，GIF 保留动画帧）。
        文件内容不可变，响应带 Cache-Control: public, max-age=31536000, immutable。
