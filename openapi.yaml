  /api/v1/admin/alerts:
    get:
      tags: [Admin]
      summary: 获取监控告警列表
      description: |
        A11（DES-20261001-01 §12.3）：返回评估器（disk/health/livekit/database/
        tts_worker 五项检查，连续 3 周期超标防抖后 open）产生的告警。
        默认返回活跃告警 + 最近 50 条已恢复历史；includeResolved=false 只返回活跃。
        实时变化经 admin WebSocket 的 admin_alert / admin_alert_snapshot 事件推送。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: includeResolved
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: 是否包含已恢复（resolved_at 非空）的历史告警
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: 已恢复历史的最大条数
      responses:
        '200':
          description: 告警列表
          content:
            application/json:
              schema:
                type: object
                required:
                - active
                - resolved
                - activeCount
                properties:
                  active:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAlert'
                    description: 活跃告警（resolved_at 为空），按 last_seen_at 倒序
                  resolved:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAlert'
                    description: 已恢复历史
                  activeCount:
                    type: integer
                    description: 活跃告警条数
                    example: 1
        '403':
          description: 无权访问
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/alerts/{id}/mute:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: 告警ID
      example: alert_723169646487932928
    post:
      tags: [Admin]
      summary: 静默指定告警
      description: |
        A11（DES-20261001-01 §12.3）：为该告警行写入 muted_until。静默按 type
        生效——期间评估器照常写表（open/update/resolved 均落库），但同 type
        不再向 admin WebSocket 推送。操作写入管理审计（action=alert_mute）。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hours:
                  type: integer
                  minimum: 1
                  maximum: 720
                  default: 24
                  description: 静默时长（小时），缺省 24
      responses:
        '200':
          description: 静默成功
          content:
            application/json:
              schema:
                type: object
                required:
                - alert
                - action
                properties:
                  alert:
                    $ref: '#/components/schemas/AdminAlert'
                  action:
                    type: string
                    enum:
                    - muted
                    example: muted
        '400':
          description: hours 超出 1..720 或请求体非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 告警不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
