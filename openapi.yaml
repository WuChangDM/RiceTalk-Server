              examples:
                default:
                  value:
                    participants:
                    - user_id: usr_abc123
                      username: zhangsan
                      avatar_url: https://cdn.example.com/avatars/u1.png
                      muted: false
                      speaking: true
                      joined_at: '2024-01-15T09:30:00Z'
                    - user_id: usr_def456
