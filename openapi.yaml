    parameters:
    - name: spaceId
      in: path
      required: true
      schema:
        type: string
      description: 空间ID
    get:
      tags:
      - Bots
      summary: 获取空间机器人令牌
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BotToken'
  /api/v1/bots/tokens/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: 机器人令牌ID
    delete:
      tags:
      - Bots
      summary: 删除机器人令牌
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOK'
  /api/v1/bots/netease/{endpoint}:
    parameters:
    - name: endpoint
      in: path
      required: true
      schema:
        type: string
      description: 网易云 API 端点
    get:
      tags:
      - Bots
      summary: 网易云 API GET 代理
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeteaseProxyResponse'
    post:
      tags:
      - Bots
      summary: 网易云 API POST 代理
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeteaseProxyResponse'
  /api/v1/screenshare/sessions:
    get:
      tags:
      - ScreenShare
      summary: 获取空间屏幕共享会话列表
      security: &id002
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: spaceId
        in: query
        required: true
        schema:
          type: string
        description: 空间ID
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScreenShareSession'
  /api/v1/screenshare/sessions/active:
    get:
      tags:
      - ScreenShare
      summary: 获取空间活跃屏幕共享会话
      security: *id002
      parameters:
      - name: spaceId
        in: query
        required: true
        schema:
          type: string
        description: 空间ID
      responses:
        '200':
          description: 活跃会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScreenShareSession'
  /api/v1/screenshare/sessions/{sessionId}:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: 屏幕共享会话ID
    get:
      tags:
      - ScreenShare
      summary: 获取屏幕共享会话详情
      security: *id002
      responses:
        '200':
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenShareSession'

  /api/v1/screenshare/start:
    post:
      tags:
      - ScreenShare
      summary: 开始屏幕共享
      description: Web 端禁止发起，仅桌面客户端
      security: *id002
      parameters:
      - name: X-Client-Type
        in: header
        required: false
        schema:
          type: string
        description: 客户端类型（web 时拒绝）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - spaceId
              properties:
                spaceId:
                  type: string
                  description: 空间ID
                bindChannelId:
                  type: string
                  nullable: true
                  description: 绑定的文字频道ID
                shareType:
                  type: string
                  enum:
                  - screen
                  - window
                  - browser_tab
                  description: 共享类型
                viewerPolicy:
                  type: string
                  enum:
                  - all
                  - admin_only
                  description: 观看权限策略
      responses:
        '200':
          description: 屏幕共享已开始
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
        '403':
          description: Web 端禁止发起屏幕共享

  /api/v1/screenshare/stop:
    post:
      tags:
      - ScreenShare
      summary: 停止自己的屏幕共享
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sessionId
              properties:
                sessionId:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOK'

  /api/v1/screenshare/force-stop:
    post:
      tags:
      - ScreenShare
      summary: 强制停止屏幕共享
      description: 仅 Owner/Admin 可调用
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sessionId
              properties:
                sessionId:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOK'
  /api/v1/screenshare/sessions/{sessionId}/pause:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: 屏幕共享会话ID
    post:
      tags:
      - ScreenShare
      summary: 暂停屏幕共享
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOK'
  /api/v1/screenshare/sessions/{sessionId}/resume:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: 屏幕共享会话ID
    post:
      tags:
      - ScreenShare
      summary: 恢复屏幕共享
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOK'
  /api/v1/screenshare/sessions/{sessionId}/policy:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: 屏幕共享会话ID
    post:
      tags:
      - ScreenShare
      summary: 更新屏幕共享观看策略
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - viewerPolicy
              properties:
                viewerPolicy:
                  type: string
                  enum:
                  - all
                  - admin_only
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericOK'

components:
  # ═══════════════════════════════════════════════════════════
  # 认证安全定义 (Security Schemes)
  # ═══════════════════════════════════════════════════════════
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT令牌认证，在Authorization头部中传递
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session Cookie认证

  # ═══════════════════════════════════════════════════════════
  # 请求参数定义 (Parameters)
  # ═══════════════════════════════════════════════════════════
  parameters:
    ChannelIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 频道ID
      example: ch_abc123
    MessageIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 消息ID
      example: msg_abc123
    UserIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 用户ID
      example: usr_abc123
    FileIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 文件ID
      example: file_abc123
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: 分页数量限制
      example: 50
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 分页游标
      example: eyJpZCI6Im1zZ18xMjMifQ

  # ═══════════════════════════════════════════════════════════
  # 数据模型定义 (Schemas)
  # ═══════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════
  # 服务信息 (Server)
  # ═══════════════════════════════════════════════════════════

  schemas:
    # ── 错误响应 ──
    ErrorResponse:
      type: object
      required:
      - code
      - message
      description: 统一错误响应格式
      properties:
        code:
          type: string
          description: 错误码
          example: USERNAME_EXISTS
        message:
          type: string
          description: 错误描述
          example: 用户名已被使用
        details:
          type: object
          nullable: true
          description: 额外错误详情
          example:
            field: username
            requirement: 至少3个字符
    RegisterRequest:
      type: object
      required:
      - username
      - email
      - password
      - securityQuestions
      description: 用户注册请求（必须设置1-2个密保问题）
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_\u4e00-\u9fa5]+$
          description: 用户名，3-30位字母数字下划线或中文
          example: zhangsan
        email:
          type: string
          format: email
          maxLength: 255
          description: 邮箱地址
          example: zhangsan@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: |
            密码，至少8位，需包含大小写字母、数字和特殊字符
          example: SecurePass123!
        securityQuestions:
          type: array
          minItems: 1
          maxItems: 2
          description: 密保问题与答案，用于找回密码
          items:
            $ref: '#/components/schemas/SecurityQuestionItem'
    SecurityQuestionItem:
      type: object
      required:
      - question
      - answer
      properties:
        question:
          type: string
          description: 预设的密保问题文本
          example: 您出生城市是哪里？
        answer:
          type: string
          minLength: 2
          maxLength: 64
          description: 密保问题答案
          example: 上海
    LoginRequest:
      type: object
      required:
      - email
      - password
      description: 用户登录请求
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
          example: zhangsan@example.com
        password:
          type: string
          format: password
          description: 密码
          example: SecurePass123!
        deviceType:
          type: string
          maxLength: 32
          description: 可选。登录设备类型（S-2 多设备标识），如 windows-desktop / web；超长截断，缺省空串
          example: windows-desktop
        deviceName:
          type: string
          maxLength: 64
          description: 可选。登录设备名（如主机名），用于「登录设备」列表展示；按字符截断，缺省空串
          example: DEV-PC
    AuthSession:
      type: object
      description: 一条活跃登录会话（S-2 多设备标识）
      required:
      - id
      - lastActiveAt
      - createdAt
      - expiresAt
      - isCurrent
      properties:
        id:
          type: string
          description: 会话 ID
          example: '123456789012345678'
        deviceType:
          type: string
          description: 设备类型（缺省空串）
          example: windows-desktop
        deviceName:
          type: string
          description: 设备名（缺省空串）
          example: DEV-PC
        ip:
          type: string
          description: |-
            该会话最近一次登录/refresh 的来源 IP（A4-S1）。仅会话归属者本人
            可见；客户端负责脱敏展示（desensitizeIp）。迁移前的老会话行为
            空串（未知）。
          example: '<REDACTED-PRODUCTION-IP>'
        lastActiveAt:
          type: string
          format: date-time
          description: 最近一次 refresh 轮换时间；老会话回填为创建时间
        createdAt:
          type: string
          format: date-time
          description: 会话创建时间（即登录时间）
        expiresAt:
          type: string
          format: date-time
          description: 会话过期时间
        isCurrent:
          type: boolean
          description: 是否为发起本次请求的当前会话
    AuthResponse:
      type: object
      required:
      - user
      - token
      description: 认证响应（注册/登录）
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT访问令牌
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfYWJjMTIzIiwiaWF0IjoxNzA1MzEzNDAwLCJleHAiOjE3MDUzOTk4MDB9
    WebSocketMessage:
      type: object
      required:
      - type
      description: WebSocket 消息通用格式
      properties:
        type:
          type: string
          enum:
          - subscribe
          - unsubscribe
          - message_ack
          - presence_update
          - typing
          - voice_state_change
          - screenshare_started
          - screenshare_stopped
          - stroke_draw
          - stroke_erase
          - raise_hand
          - recording_started
          - recording_stopped
          - server_config_updated
          description: 消息类型
        payload:
          type: object
          description: 类型相关的载荷
    ServerConfigUpdatedPayload:
      type: object
      required:
      - keys
      description: |
        服务器网络配置变更通知（N29 配置热刷新）。管理员保存
        `PUT /api/v1/admin/network` 成功后由 realtime Hub 全局广播。
        payload 只携带**变更字段的键名**、不携带值——事件面向所有已连接
        客户端，完整配置仍须各自经 /api/v1/server/info 拉取，避免把
        网络配置泄露给非 Owner。客户端收到后应重新请求 server-info；
        旧客户端事件分发为白名单 switch，未知事件落 default 忽略（天然兼容）。
        无变更的幂等保存不广播。
      properties:
        keys:
          type: array
          items:
            type: string
            enum:
            - externalHost
            - externalHttpPort
            - externalLiveKitWsPort
            - externalMediaUdpPort
            - externalAdminPort
            - externalLiveKitTcpPort
            - useHttps
            - upnpEnabled
            - turnTcpFallbackEnabled
            - webVoiceEnabled
            - clientAccessEnabled
          description: 发生变更的字段键名列表（与 NetworkConfig 的 json 字段名一致）
          example:
          - webVoiceEnabled
    VoiceStateChangePayload:
      type: object
      required:
      - userId
      - roomId
      - event
      description: 语音状态变更事件
      properties:
        userId:
          type: string
        roomId:
          type: string
        event:
          type: string
          enum:
          - started_speaking
          - stopped_speaking
          - muted
          - unmuted
          - joined
          - left
          - screen_share_started
          - screen_share_stopped
        timestamp:
          type: string
          format: date-time
    RaiseHandPayload:
      type: object
      required:
      - userId
      - roomId
      - action
      description: 举手发言事件
      properties:
        userId:
          type: string
        roomId:
          type: string
        action:
          type: string
          enum:
          - raise
          - lower
        raisedAt:
          type: string
          format: date-time
    ScreenShareEventPayload:
      type: object
      required:
      - userId
      - channelId
      - event
      properties:
        userId:
          type: string
        username:
          type: string
        channelId:
          type: string
        event:
          type: string
          enum:
          - started
          - stopped
        startedAt:
          type: string
          format: date-time

    # 白板笔迹事件
    WhiteboardStrokePayload:
      type: object
      required:
      - channelId
      - userId
      - stroke
      properties:
        channelId:
          type: string
        userId:
          type: string
        stroke:
          $ref: '#/components/schemas/WhiteboardStroke'
    RecordingEventPayload:
      type: object
      required:
      - roomId
      - event
      description: 录制事件
      properties:
        roomId:
          type: string
        event:
          type: string
          enum:
          - started
          - stopped
        recordingId:
          type: string
        startedBy:
          type: string
        stoppedBy:
          type: string
    VoiceQualityConfig:
      type: object
      description: 语音频道音质配置
      properties:
        quality:
          type: string
          enum:
          - fluent
          - standard
          - high
          - ultra
          description: 音质级别
        bitrateKbps:
          type: integer
          enum:
          - 24
          - 64
          - 128
          - 256
          description: 音频码率
        stereo:
          type: boolean
          description: 是否立体声
        sampleRateHz:
          type: integer
          enum:
          - 16000
          - 24000
          - 48000
          description: 采样率
    User:
      type: object
      required:
      - id
      - username
      - displayName
      - email
      - avatar
      - role
      - status
      - theme
      - createdAt
      description: 用户信息
      properties:
        id:
          type: string
          description: 用户唯一标识
          example: usr_abc123
        username:
          type: string
          description: 用户名
          example: zhangsan
        displayName:
          type: string
          description: 显示名称
          example: 张三
        email:
          type: string
          format: email
          description: 邮箱地址
          example: zhangsan@example.com
        avatar:
          type: string
          format: uri
          description: 头像URL
          example: https://cdn.example.com/avatars/u1.png
        role:
          type: string
          enum:
          - owner
          - admin
          - member
          description: 角色 (所有者/管理员/成员)
          example: member
        status:
          type: string
          enum:
          - online
          - away
          - offline
          - dnd
          - invisible
          - gaming
          description: |
            在线状态:
            - online: 在线
            - away: 离开
            - offline: 离线
            - dnd: 勿扰
            - invisible: 隐身
            - gaming: 游戏中
          example: online
        customStatus:
          type: string
          nullable: true
          description: 自定义状态文本
          example: 专注开发中
        theme:
          type: string
          enum:
          - dark
          - light
          description: 界面主题
          example: dark
        createdAt:
          type: string
          format: date-time
          description: 注册时间
          example: '2024-01-15T08:30:00Z'
    Channel:
      type: object
      required:
      - id
      - spaceId
      - name
      - type
      - visibility
      - position
      - participantCount
      - createdAt
      description: 频道信息
      properties:
        id:
          type: string
          description: 频道唯一标识
          example: ch_abc123
        spaceId:
          type: string
          description: 所属空间ID
          example: spc_main
        name:
          type: string
          maxLength: 100
          description: 频道名称
          example: 综合讨论
        type:
          type: string
          enum:
          - text
          - voice
          description: |-
            频道类型: text=文字, voice=语音。历史 dm 记录仅保留在存储中，不属于当前公开能力。
          example: text
        visibility:
          type: string
          enum:
          - public
          - admin-only
          - role-specific
          description: |-
            可见性级别: public=公开, admin-only=管理员可见, role-specific=按角色授权
          example: public
        audioQuality:
          type: string
          nullable: true
          enum:
          - low
          - medium
          - high
          description: 语音质量（仅voice类型）
          example: high
        position:
          type: integer
          minimum: 1
          description: 排序序号
          example: 1
        sortGroup:
          type: string
          maxLength: 32
          description: |-
            频道分组名（A1-S1）。空串表示「未分组」。列表接口的排序规则：
            未分组段永远最前，其后按分组名字典序，组内按 position、created_at。
          example: 文字区
        pinnedMessageId:
          type: string
          nullable: true
          description: 置顶消息ID
          example: msg_pinned001
        participantCount:
          type: integer
          minimum: 0
          description: 当前参与者数量（仅voice频道）
          example: 5
        createdAt:
          type: string
          format: date-time
          description: 创建时间
          example: '2024-01-10T06:00:00Z'
    Message:
      type: object
      required:
      - id
      - channelId
      - authorUsername
      - authorDisplayName
      - authorAvatarUrl
      - authorRole
      - content
      - type
      - createdAt
      description: 消息信息
      properties:
        id:
          type: string
          description: 消息唯一标识
          example: msg_abc123
        channelId:
          type: string
          description: 所属频道ID
          example: ch_abc123
        authorUsername:
          type: string
          description: 发送者用户ID
          example: usr_abc123
        authorDisplayName:
          type: string
          description: 发送者显示名称
          example: 张三
        authorAvatarUrl:
          type: string
          format: uri
          description: 发送者头像URL
          example: https://cdn.example.com/avatars/u1.png
        authorRole:
          type: string
          enum:
          - owner
          - admin
          - member
          description: 发送者角色
          example: member
        content:
          type: string
          maxLength: 4000
