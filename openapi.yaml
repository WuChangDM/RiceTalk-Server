      responses:
        '200':
          description: 预览信息
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - title
                - description
                - imageUrl
                properties:
                  url:
                    type: string
                    format: uri
                    description: 原始URL
                    example: https://www.example.com/article/123
                  title:
                    type: string
                    description: 页面标题
                    example: 如何构建高效的技术团队
                  description:
                    type: string
                    description: 页面描述
                    example: 本文分享了构建高效技术团队的实践经验和方法论...
                  imageUrl:
                    type: string
                    format: uri
                    nullable: true
                    description: 页面图片URL
                    example: https://www.example.com/images/team.jpg
        '400':
          description: URL无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PREVIEWInvalidUrl:
                  value:
                    code: PREVIEW_INVALID_URL
                    message: URL格式无效
                PREVIEWFetchFailed:
                  value:
                    code: PREVIEW_FETCH_FAILED
                    message: 无法获取页面内容
  /api/v1/channels/{id}/mark-read:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: 频道ID
      example: ch_abc123
    post:
      tags: [Messages]
      summary: 标记频道已读（M16）
      description: |
        标记当前用户在该频道已读到指定消息。请求体可省略（等价 `{}`，SEC-001 允许空 body），
        省略 lastMessageId 时服务端自动取频道最新一条。读到中间某条时传该条 ID：
        服务端按「该条之后的消息」继续计未读（定位点语义）。
        成功后服务端向本人所有连接广播 `unread_count_changed` 事件
        （payload 含 channelId/userId/unreadCount/mentionCount/firstUnreadMessageId，mark-read 后计数为 0、锚点为空串）。
        兼容说明：旧路由 `POST /api/v1/channels/{id}/read` 指向同一 handler，后续版本将移除。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lastMessageId:
                  type: string
                  description: 已读位置的消息 ID；缺省取频道最新一条
                  example: msg_abc123
      responses:
        '200':
          description: 标记成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: marked as read
        '403':
          description: 无频道访问权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CHANNELAccessDenied:
                  value:
                    code: CHANNEL_ACCESS_DENIED
                    message: 频道访问被拒绝
  /api/v1/channels/{id}/unread:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: 频道ID
      example: ch_abc123
    get:
      tags: [Messages]
      summary: 获取未读消息统计
      description: 获取指定频道的未读消息数量和@提及数量。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 未读统计
          content:
            application/json:
              schema:
                type: object
                required:
                - unreadCount
                - mentionCount
                - firstUnreadMessageId
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
                    description: 未读消息数量
                    example: 42
                  mentionCount:
                    type: integer
                    minimum: 0
                    description: '@提及数量'
                    example: 3
                  firstUnreadMessageId:
                    type: string
                    nullable: true
                    description: 第一条未读消息ID
                    example: msg_first_unread_001
  /api/v1/channels/mutes:
    get:
      tags: [Channels]
      summary: 获取当前用户的频道静音清单（T4/S-1）
      description: 返回当前用户生效中的频道静音（永久 + 未到期限时）。客户端启动时批量拉取用于红点/通知判定。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 生效中的静音清单
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, userId, channelId]
                  properties:
                    id:
                      type: string
                      example: event_abc123
                    userId:
                      type: string
                      example: user_abc123
                    channelId:
                      type: string
                      example: ch_abc123
                    mutedUntil:
                      type: string
                      format: date-time
                      nullable: true
                      description: 静音截止时间；null 表示永久静音
                    createdAt:
                      type: string
                      format: date-time
  /api/v1/channels/{id}/mute:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: 频道ID
      example: ch_abc123
    put:
      tags: [Channels]
      summary: 设置/取消频道静音（T4/S-1）
      description: |
        本人操作本人静音。muted=true 开启静音，durationMinutes>0 表示限时静音（省略或 0 为永久）；
        muted=false 取消静音（幂等）。频道可见性走 ChannelPermission 防线（admin-only 频道 MEMBER 返回 403）。
        语义对齐 Discord muted：静音频道内所有消息（含 @提及）均不再触发 OS 通知、不计入任务栏徽标。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted:
                  type: boolean
                  description: true 开启静音 / false 取消静音
                  example: true
                durationMinutes:
                  type: integer
                  minimum: 0
                  description: 限时静音分钟数；0 或缺省表示永久
                  example: 60
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: channel muted
        '400':
          description: 请求体非法（缺 muted 或 durationMinutes < 0）
        '401':
          description: 未登录
        '403':
          description: 非频道可见成员（admin-only 频道 MEMBER）
        '404':
          description: 频道不存在
  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: 忘记密码（获取密保问题）
      description: 根据邮箱返回该账号设置的密保问题列表。如果邮箱未注册，仍然返回 200 但问题列表为空，防止邮箱枚举。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  description: 用户注册邮箱
                  example: zhangsan@example.com
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                required:
                - questions
                properties:
                  questions:
                    type: array
                    items:
                      type: string
                    description: 密保问题文本列表（未注册账号返回空数组）
                    example: ["您出生城市是哪里？"]
  /api/v1/auth/forgot-password/verify:
    post:
      tags: [Authentication]
      summary: 验证密保问题答案
      description: 提交密保问题答案，验证通过后返回一次性密码重置令牌（10分钟有效）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - answers
              properties:
                email:
                  type: string
                  format: email
                  description: 用户注册邮箱
                  example: zhangsan@example.com
                answers:
                  type: array
                  minItems: 1
                  maxItems: 2
                  description: 密保问题答案列表
                  items:
                    $ref: '#/components/schemas/SecurityQuestionItem'
      responses:
        '200':
          description: 验证成功，返回重置令牌
          content:
            application/json:
              schema:
                type: object
                required:
                - resetToken
                properties:
                  resetToken:
                    type: string
                    description: 一次性密码重置令牌
                    example: rst_a1b2c3d4e5f6
        '403':
          description: 密保问题答案错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SECURITYQUESTIONIncorrect:
                  value:
                    code: AUTH_SECURITY_QUESTION_INCORRECT
                    message: 密保问题答案错误
        '429':
          description: 验证次数过多已锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SECURITYQUESTIONLocked:
                  value:
                    code: AUTH_SECURITY_QUESTION_LOCKED
                    message: 密保问题验证已锁定
  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: 重置密码
      description: 使用密保问题验证通过后获得的一次性重置令牌设置新密码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - newPassword
              properties:
                token:
                  type: string
                  description: 密保问题验证后返回的重置令牌
                  example: rst_a1b2c3d4e5f6
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: 新密码
                  example: NewSecurePass456!
      responses:
