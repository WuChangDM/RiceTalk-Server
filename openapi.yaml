  # ── 屏幕共享实时状态推送(WebSocket) ──
  # 注：屏幕共享状态变更通过 WebSocket 广播，不需要 HTTP 端点
  # 客户端通过 WebSocket 接收 screenshare_started/screenshare_stopped 事件

  # ── 白板实时同步(WebSocket) ──
  # 注：白板笔迹通过 WebSocket stroke_draw/stroke_erase 事件实时同步
  # 客户端通过 WebSocket 发送/接收笔迹操作

# ═══════════════════════════════════════════════════════════
  # 机器人模块 (Bots)
  # ═══════════════════════════════════════════════════════════

  /api/v1/files:
    post:
      tags: [Files]
      summary: 上传文件
      description: 上传文件到服务器，最大支持100MB。返回文件元数据和访问URL。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件 (最大100MB)
      responses:
        '201':
          description: 文件上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
              examples:
                default:
                  value:
                    id: file_abc123
                    url: https://cdn.example.com/files/doc_abc123.pdf
                    filename: 项目需求文档.pdf
                    size: 2048000
                    mime_type: application/pdf
                    created_by: usr_abc123
                    created_at: '2024-01-15T10:30:00Z'
        '400':
          description: 文件错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FILETooLarge:
                  value:
                    code: FILE_TOO_LARGE
                    message: 文件大小超过100MB限制
                    details:
                      max_size: 100MB
                INVALIDType:
                  value:
                    code: INVALID_TYPE
                    message: 不支持的文件类型
  /api/v1/emojis:
    get:
      tags: [Emojis]
      summary: 获取空间自定义表情列表
      description: |-
        返回指定空间的全部自定义表情（DES-20261002-01 §4.7 B7 轻量版）。
        仅空间成员（或全局 OWNER）可读。空间无自定义表情时返回空数组。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: spaceId
        in: query
        required: true
        schema:
          type: string
        description: 空间 ID（已登录时也可省略，取 JWT 中的当前空间）
      responses:
        '200':
          description: 表情列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerEmoji'
        '403':
          description: 非空间成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permissionDenied:
                  value:
                    code: EMOJI_PERMISSION_DENIED
                    message: 你没有权限管理自定义表情
    post:
      tags: [Emojis]
      summary: 上传空间自定义表情
      description: |-
        上传 PNG/GIF/WebP 图片作为空间自定义表情（单个 ≤128KB，每空间 ≤50 个）。
        仅全局 OWNER / 空间 OWNER / 空间管理员可调用。name 限 [a-z0-9_] 2-32 位，
        空间内唯一；成功后向空间在线成员定向广播 emoji_created。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - name
              - file
              properties:
                name:
                  type: string
                  pattern: '^[a-z0-9_]{2,32}$'
                  description: "表情名称（消息中以 :name: 引用）"
                  example: rice_face
                file:
                  type: string
                  format: binary
                  description: 图片文件（PNG/GIF/WebP，≤128KB；GIF 保留动画）
                spaceId:
                  type: string
                  description: 空间 ID（可省略，取 JWT 当前空间）
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/ServerEmoji'
        '400':
          description: 名称非法 / 文件超限 / 类型不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nameInvalid:
                  value:
                    code: EMOJI_NAME_INVALID
                    message: 表情名称不合法（限小写字母、数字、下划线，2-32 位）
                fileTooLarge:
                  value:
                    code: EMOJI_FILE_TOO_LARGE
                    message: 表情文件不能超过 128KB
                fileInvalid:
                  value:
                    code: EMOJI_FILE_INVALID
                    message: 仅支持 PNG/GIF/WebP 图片
        '403':
          description: 非空间管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                permissionDenied:
                  value:
                    code: EMOJI_PERMISSION_DENIED
                    message: 你没有权限管理自定义表情
        '409':
          description: 名称冲突或数量达上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                nameTaken:
                  value:
                    code: EMOJI_NAME_TAKEN
                    message: 该表情名称已被占用
                limitReached:
                  value:
                    code: EMOJI_LIMIT_REACHED
                    message: 本空间自定义表情数量已达上限
  /api/v1/emojis/{id}:
    delete:
      tags: [Emojis]
      summary: 删除空间自定义表情
      description: |-
        删除表情行与存储对象。创建者本人、空间管理员或全局 OWNER 可删除；
