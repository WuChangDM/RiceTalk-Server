      responses:
        '200':
          description: 图片字节流
          headers:
            Content-Type:
              schema:
                type: string
                enum: [image/png, image/gif, image/webp]
            Cache-Control:
              schema:
                type: string
                example: public, max-age=31536000, immutable
        '403':
          description: 非该空间成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 表情不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
