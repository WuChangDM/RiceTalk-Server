  /api/v1/bots/tts/voices:
    get:
      tags:
      - Bots
      summary: TTS 音色能力发现
      description: >-
        返回 TTS 引擎（Sherpa-ONNX）运行时探测的真实音色清单（说话人数来自 ONNX
        模型元数据，无硬编码）。客户端音色下拉只展示本接口返回的清单；
        TTS 合成时 voice 参数（voices[].id）在多说话人模型上映射到 speaker id，
        单说话人模型（当前 vits-melo-tts-zh_en，仅 1 个中文女声）忽略 voice。
        引擎未初始化/模型缺失时 available=false、voices 为空数组。
      security: *id001
      responses:
        '200':
          description: 引擎音色能力
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    type: object
                    required: [available, engine, numSpeakers, voices]
                    properties:
                      available:
                        type: boolean
                        description: 引擎是否就绪
                      engine:
                        type: string
                        example: sherpa-onnx
                      model:
                        type: string
                        description: 模型目录名（如 vits-melo-tts-zh_en）
                      numSpeakers:
                        type: integer
                        description: 引擎报告的说话人数；引擎不可用时为 0
                      voices:
                        type: array
                        description: 音色清单；引擎不可用时为空数组
                        items:
                          type: object
                          required: [id, name]
                          properties:
                            id:
                              type: string
                              description: speaker id 字符串，合成时作为 voice 参数回传
                            name:
                              type: string
                              description: 展示名（单说话人为「默认音色」，多说话人为「音色 N」）
