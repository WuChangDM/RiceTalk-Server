openapi: 3.0.3
# RidgeRiceTalkAPI规范 - AI可执行级别的完整接口定义
info:
  title: RidgeRiceTalk API
  description: |
    RidgeRiceTalk — 自托管语音协作空间 API。

    设计原则：
    - 整个服务器即唯一空间（单例模式，无多租户）
    - 面向朋友/小团队，权限简单（OWNER/ADMIN/MEMBER）
    - 语音为核心，其他功能为辅助
    - 部署简单，SQLite 零配置默认

    功能模块：即时消息、语音通话（LiveKit）、音乐机器人、文件共享、
    白板协作、屏幕共享、小游戏、日程安排。

    认证方式：Bearer Token (JWT) + Session Cookie 双模式。
  version: 1.0.0
  contact:
    name: RidgeRiceTalk API Team
servers:
- url: https://api.ridgericetalk.example.com/api
  description: 生产环境
- url: http://localhost:8080/api
  description: 本地开发环境

security:
- BearerAuth: []
- CookieAuth: []

# 全局标签定义
tags:
- name: Authentication
  description: 认证模块 - 用户注册、登录、登出、密码重置
- name: Users
  description: 用户模块 - 用户资料管理、状态设置、头像上传
- name: Space
  description: 空间模块 - 服务器信息（单例：整个服务器即唯一空间）
- name: Channels
  description: 频道模块 - 文本/语音频道管理（简单公开/私有两种可见度）
- name: Messages
  description: 消息模块 - 消息发送、线程回复、表情回应、已读确认
- name: Voice
  description: 语音模块 - LiveKit 实时语音（核心功能）：通话令牌、参与者管理、屏幕共享
- name: Bots
  description: 机器人模块 - 音乐机器人（网易云）+ TTS 语音合成
- name: Files
  description: 文件模块 - 文件上传、下载、删除
- name: Whiteboard
  description: 白板模块 - 白板笔迹管理
- name: Admin
  description: 管理模块 - 服务器管理：用户管理、模块开关、系统监控
- name: Server
  description: 服务发现 - 服务器信息、健康检查
- name: Preview
  description: 链接预览 - URL元数据获取

# 外部文档
externalDocs:
  description: 详细API文档
  url: https://docs.ridgericetalk.example.com

paths:

  # ═══════════════════════════════════════════════════════════
  # 认证模块 (Authentication)
  # ═══════════════════════════════════════════════════════════

  # ── 用户注册 ──
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: 用户注册
      description: 创建新用户账号，返回用户信息和JWT令牌。
      security: []  # 注册无需认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  username: zhangsan
                  email: zhangsan@example.com
                  password: SecurePass123!
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                default:
                  value:
                    user:
                      id: usr_abc123
                      username: zhangsan
                      display_name: 张三
                      email: zhangsan@example.com
                      avatar_url: https://cdn.example.com/avatars/default.png
                      role: member
                      status: online
                      custom_status:
                      theme: dark
                      created_at: '2024-01-15T08:30:00Z'
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USERNAMEExists:
                  value:
                    code: USERNAME_EXISTS
                    message: 用户名已被使用
                    details: {}
                EMAILExists:
                  value:
                    code: EMAIL_EXISTS
                    message: 邮箱已被注册
                    details: {}
                INVALIDPassword:
                  value:
                    code: INVALID_PASSWORD
                    message: 密码不符合安全要求
                    details:
                      requirements: 至少8位，包含大小写字母、数字和特殊字符
        '409':
          description: 显示名已在本空间中被使用（FIX-2026-0808-01）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DisplayNameExists:
                  value:
                    code: AUTH_DISPLAY_NAME_EXISTS
                    message: display name already used in this space
                    chinese_message: 该显示名已在本空间中使用，请更换
                    details: {}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: 用户登录
      description: 使用邮箱和密码登录，返回用户信息和JWT令牌。
      security: []  # 登录无需认证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: zhangsan@example.com
                  password: SecurePass123!
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 登录失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALIDCredentials:
                  value:
                    code: INVALID_CREDENTIALS
                    message: 邮箱或密码错误
                    details: {}
                ACCOUNTLocked:
                  value:
                    code: ACCOUNT_LOCKED
                    message: 账户已锁定，请30分钟后重试
                    details:
                      lock_expires_at: '2024-01-15T09:00:00Z'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: 用户登出
      description: 销毁当前会话，使JWT令牌失效。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 登出请求体（可为空）
      responses:
        '204':
          description: 登出成功
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTHRequired:
                  value:
                    code: AUTH_REQUIRED
                    message: 未提供认证凭据
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: 刷新访问令牌
      description: 使用刷新令牌获取新的访问令牌。S-2 多设备标识：请求体可携带设备信息，
        轮换后的会话行更新设备字段并推进 lastActiveAt；未携带时继承旧会话的设备字段。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: 刷新令牌
                deviceType:
                  type: string
                  maxLength: 32
                  description: 可选。设备类型（S-2），覆盖旧会话行携带的值
                  example: windows-desktop
                deviceName:
                  type: string
                  maxLength: 64
                  description: 可选。设备名（S-2），覆盖旧会话行携带的值
                  example: DEV-PC
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: 新的JWT访问令牌
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: 令牌无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TOKENInvalid:
                  value:
                    code: TOKEN_INVALID
                    message: 令牌无效或已过期
  /api/v1/auth/sessions:
    get:
      tags: [Authentication]
      summary: 获取当前用户的活跃登录会话列表
      description: |-
        S-2 多设备标识：返回当前用户自己的全部未过期会话（含设备信息），
        按最近活跃倒序。当前会话通过 isCurrent 标记（依据访问令牌的 session_id 声明）。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuthSession'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      summary: 下线当前用户自己的其他登录会话
      description: |-
        S-2 多设备标识：踢除当前用户名下的指定会话（"下线此设备"）。
        - 不能踢除当前会话（HTTP 400，请走 /auth/logout）；
        - 会话不存在或不属于当前用户均返回 404（不区分以避免枚举他人会话 ID）。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
        description: 目标会话 ID
      responses:
        '200':
          description: 下线成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: session revoked
        '400':
          description: 目标会话即当前会话（应改用 /auth/logout）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 会话不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sessions/revoke-others:
    post:
      tags: [Authentication]
      summary: 下线当前用户除当前会话外的全部登录会话
      description: |-
        A4-S1（DES-20261001-01 §5.2）：一键下线当前用户名下除当前会话外的
        全部活跃会话（"下线其他全部设备"）。当前会话依据访问令牌的
        session_id 声明识别，保持不动。成功写审计
        SecurityAuditLog（action=auth.sessions.revoke_others，仅记数量）。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 下线成功，返回被下线的会话数（0 表示没有其他设备在线）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked:
                        type: integer
                        description: 被下线（删除）的会话数量
                        example: 2
        '400':
          description: |-
            访问令牌缺少 session_id 声明（旧 token），无法识别当前会话。
            错误码 AUTH_NO_SESSION_CONTEXT，需重新登录。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      tags: [Users]
      summary: 获取用户列表
      description: 获取当前空间中的用户列表，可按频道ID筛选成员。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: channelId
        in: query
        required: false
        schema:
          type: string
        description: 频道ID，筛选该频道的成员
        example: ch_abc123
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                properties:
                  users:
                    type: array
                    description: 用户列表
                    items:
                      $ref: '#/components/schemas/User'
              examples:
                default:
                  value:
                    users:
                    - id: usr_abc123
                      username: zhangsan
                      display_name: 张三
                      email: zhangsan@example.com
                      avatar_url: https://cdn.example.com/avatars/u1.png
                      role: member
                      status: online
                      custom_status: 忙碌中
                      theme: dark
                      created_at: '2024-01-15T08:30:00Z'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTHRequired:
                  value:
                    code: AUTH_REQUIRED
                    message: 未提供认证凭据
  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: 获取用户详情
      description: 获取指定用户的详细信息。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 用户ID
        example: usr_abc123
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  value:
                    id: usr_abc123
                    username: zhangsan
                    display_name: 张三
                    email: zhangsan@example.com
                    avatar_url: https://cdn.example.com/avatars/u1.png
                    role: member
                    status: online
                    custom_status: 忙碌中
                    theme: dark
                    created_at: '2024-01-15T08:30:00Z'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USERNotFound:
                  value:
                    code: USER_NOT_FOUND
                    message: 用户不存在
    patch:
      tags: [Users]
      summary: 更新用户信息
      description: 更新用户的显示名称、邮箱或主题设置。用户只能修改自己的资料。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 用户ID
        example: usr_abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 50
                  description: 显示名称
                  example: 张三
                email:
                  type: string
                  format: email
                  description: 邮箱地址
                  example: zhangsan@example.com
                theme:
                  type: string
                  enum:
                  - dark
                  - light
                  description: 界面主题
                  example: dark
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USERNotFound:
                  value:
                    code: USER_NOT_FOUND
                    message: 用户不存在
        '403':
          description: 无权修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 无权修改其他用户资料
        '409':
          description: 显示名已在本空间中被使用（FIX-2026-0808-01）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DisplayNameExists:
                  value:
                    code: AUTH_DISPLAY_NAME_EXISTS
                    message: display name already used in this space
                    chinese_message: 该显示名已在本空间中使用，请更换
                    details: {}
  /api/v1/users/{id}/status:
    put:
      tags: [Users]
      summary: 更新用户在线状态
      description: 更新用户的在线状态和自定义状态文本。
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 用户ID
        example: usr_abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - online
                  - away
                  - offline
                  - dnd
                  - invisible
                  - gaming
                  description: 在线状态
                  example: dnd
                customStatus:
                  type: string
                  maxLength: 100
                  nullable: true
                  description: 自定义状态文本
                  example: 专注开发中，请勿打扰
      responses:
        '200':
          description: 状态更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - online
                    - away
                    - offline
                    - dnd
                    - invisible
                    - gaming
                    description: 当前状态
                    example: dnd
                  customStatus:
                    type: string
                    nullable: true
                    description: 自定义状态文本
                    example: 专注开发中，请勿打扰
        '400':
          description: 无效的状态值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALIDStatus:
                  value:
                    code: INVALID_STATUS
                    message: 无效的状态值
  /api/v1/space:
    get:
      tags: [Space]
      summary: 获取空间信息
      description: 获取服务器空间信息。整个服务器即唯一空间，此端点返回服务器基本信息。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 空间信息
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - ownerId
                - createdAt
                properties:
                  id:
                    type: string
                    description: 空间ID
                    example: spc_abc123
                  name:
                    type: string
                    description: 空间名称
                    example: RidgeRiceTalk
                  ownerId:
                    type: string
                    description: 所有者用户ID
                    example: usr_owner001
                  createdAt:
                    type: string
                    format: date-time
                    description: 创建时间
                    example: '2024-01-10T06:00:00Z'
        '404':
          description: 空间不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SPACENotFound:
                  value:
                    code: SPACE_NOT_FOUND
                    message: 空间不存在
    patch:
      tags: [Space]
      summary: 更新空间信息
      description: 更新服务器名称。仅服务器所有者可修改。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: 空间名称
                  example: RidgeRiceTalk - 研发团队
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                - space
                properties:
                  space:
                    type: object
                    required:
                    - id
                    - name
                    - ownerId
                    - createdAt
                    properties:
                      id:
                        type: string
                        example: spc_abc123
                      name:
                        type: string
                        example: RidgeRiceTalk - 研发团队
                      ownerId:
                        type: string
                        example: usr_owner001
                      createdAt:
                        type: string
                        format: date-time
                        example: '2024-01-10T06:00:00Z'
        '403':
          description: 无权修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 仅空间所有者可修改
  /api/v1/channels:
    get:
      tags: [Channels]
      summary: 获取频道列表
      description: |-
        获取当前空间中用户有权限访问的所有频道列表。
        排序（A1-S1）：未分组（sortGroup 为空）段永远最前，其后按分组名字典序，组内按 position、created_at。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 频道列表
          content:
            application/json:
              schema:
                type: object
                required:
                - channels
                properties:
                  channels:
                    type: array
                    description: 频道列表
                    items:
                      $ref: '#/components/schemas/Channel'
              examples:
                default:
                  value:
                    channels:
                    - id: ch_abc123
                      space_id: spc_main
                      name: 综合讨论
                      type: text
                      visibility: public
                      sort_order: 1
                      pinned_message_id:
                      participant_count: 0
                      created_at: '2024-01-10T06:00:00Z'
                    - id: ch_def456
                      space_id: spc_main
                      name: 语音大厅
                      type: voice
                      visibility: public
                      audio_quality: high
                      sort_order: 2
                      pinned_message_id:
                      participant_count: 5
                      created_at: '2024-01-10T06:00:00Z'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                AUTHRequired:
                  value:
                    code: AUTH_REQUIRED
                    message: 未提供认证凭据
    post:
      tags: [Channels]
      summary: 创建频道
      description: 在空间中创建新频道。仅管理员可创建频道，有频道数量限制。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - type
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: 频道名称
                  example: 产品需求讨论
                type:
                  type: string
                  enum:
                  - text
                  - voice
                  description: 频道类型
                  example: text
                audioQuality:
                  type: string
                  enum:
                  - fluent
                  - standard
                  - high
                  - ultra
                  description: 语音质量（仅voice类型需要）
                  example: standard
                isPrivate:
                  type: boolean
                  description: 是否为私有频道
                  example: false
                sortGroup:
                  type: string
                  maxLength: 32
                  description: |-
                    频道分组名（A1-S1，可选）。首尾空白会被去除；空串或省略表示「未分组」。
                    超过 32 个字符返回 400。
                  example: 文字区
      responses:
        '201':
          description: 频道创建成功
          content:
            application/json:
              schema:
                type: object
                required:
                - channel
                properties:
                  channel:
                    $ref: '#/components/schemas/Channel'
        '400':
          description: 频道数量已达上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CHANNELLimitReached:
                  value:
                    code: CHANNEL_LIMIT_REACHED
                    message: 频道数量已达上限
  /api/v1/channels/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: 频道ID
      example: ch_abc123
    delete:
      tags: [Channels]
      summary: 删除频道
      description: 删除指定频道及其所有消息。仅管理员可删除。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '204':
          description: 删除成功
        '404':
          description: 频道不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CHANNELNotFound:
                  value:
                    code: CHANNEL_NOT_FOUND
                    message: 频道不存在
        '403':
          description: 无权删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 仅管理员可删除频道
    patch:
      tags: [Channels]
      summary: 更新频道信息
      description: 更新频道名称、可见性或语音质量。仅管理员可修改。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: 频道名称
                  example: 产品需求讨论区
                isPrivate:
                  type: boolean
                  description: 是否为私有频道
                  example: false
                position:
                  type: integer
                  minimum: 0
                  description: 排序序号
                  example: 3
                sortGroup:
                  type: string
                  maxLength: 32
                  description: |-
                    频道分组名（A1-S1，指针语义）：省略本字段不修改；传空串表示移出分组；
                    传非空值时首尾空白会被去除，超过 32 个字符返回 400。
                  example: 文字区
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                - channel
                properties:
                  channel:
                    $ref: '#/components/schemas/Channel'
        '404':
          description: 频道不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CHANNELNotFound:
                  value:
                    code: CHANNEL_NOT_FOUND
                    message: 频道不存在
        '403':
          description: 无权修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: 仅管理员可修改频道
