  /api/v1/channels/{id}/messages:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: 频道ID
      example: ch_abc123
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: 返回消息数量上限
      example: 50
    - name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 分页游标
      example: eyJpZCI6Im1zZ18xMjMifQ
    - name: before_id
      in: query
      required: false
      schema:
        type: string
      description: 获取此ID之前的消息
      example: msg_abc123
    - name: around
      in: query
      required: false
      schema:
        type: string
      description: |-
        定位消息ID（消息搜索跳转用）：返回包含该消息在内的邻域一页，
        目标之前取 floor((limit-1)/2) 条、之后取其余（一侧不足时向另一侧补足，
        页最多 limit 条），按时间升序输出。
        该消息不存在或不属于该频道时返回 404 MESSAGE_NOT_FOUND。
        与 cursor 互斥；同时提供时以 around 为准。
      example: msg_def456
    get:
      tags: [Messages]
      summary: 获取频道消息列表
      description: 分页获取指定频道的消息列表，支持cursor分页、before_id定位与around邻域页定位（搜索跳转）。
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: 消息列表
          content:
            application/json:
              schema:
                type: object
                required:
                - messages
                - hasMore
                properties:
                  messages:
                    type: array
                    description: 消息列表
                    items:
                      $ref: '#/components/schemas/Message'
                  hasMore:
                    type: boolean
                    description: 是否有更多消息
                    example: true
                  nextCursor:
                    type: string
                    nullable: true
                    description: 下一页游标
                    example: eyJpZCI6Im1zZ18xMjMifQ
        '404':
          description: 频道不存在，或 around 指定的消息不存在/不属于该频道
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CHANNELNotFound:
                  value:
                    code: CHANNEL_NOT_FOUND
                    message: 频道不存在
                AroundMessageNotFound:
                  value:
                    code: MESSAGE_NOT_FOUND
                    message: 消息不存在
    post:
      tags: [Messages]
      summary: 发送消息
      description: 在指定频道发送消息。支持文本、图片、文件类型消息，可回复线程。
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
                  maxLength: 4000
                  description: 消息内容
                  example: 大家好，今天有什么进展？
                type:
                  type: string
                  enum:
                  - text
                  - image
                  - file
                  - system
                  - thread_reply
                  description: 消息类型
                  example: text
                parentId:
                  type: string
                  nullable: true
                  description: 父消息ID（创建线程回复时使用）
                  example: msg_parent001
                clientMessageId:
                  type: string
                  nullable: true
                  description: 客户端生成的消息ID（用于去重）
                  example: cmid_client_1699880000
      responses:
        '201':
          description: 消息发送成功
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '404':
          description: 频道不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CHANNELNotFound:
                  value:
                    code: CHANNEL_NOT_FOUND
                    message: 频道不存在
        '400':
          description: 消息内容过长
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MESSAGETooLong:
                  value:
                    code: MESSAGE_TOO_LONG
                    message: 消息内容超过4000字符限制
                    details:
                      max_length: 4000
